<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Tool depth planning, top view (x along the row, y out of the shelf)</title>
  <rect width="680" height="340" fill="#ffffff"/>
  <text x="20" y="24" font-size="14" font-weight="bold" fill="#2C2C2A">Top view: x along the row, y out of the shelf (robot is below)</text>
  <rect x="150" y="45" width="330" height="10" rx="2" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <g fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8">
    <rect x="190" y="60" width="40" height="160" rx="2"/>
    <rect x="235" y="60" width="40" height="130" rx="2"/>
    <rect x="345" y="60" width="40" height="130" rx="2"/>
    <rect x="390" y="60" width="40" height="120" rx="2"/>
  </g>
  <rect x="280" y="60" width="30" height="145" rx="2" fill="#CECBF6" stroke="#534AB7" stroke-width="0.8"/>
  <line x1="318" y1="190" x2="318" y2="250" stroke="#E24B4A" stroke-width="3" stroke-linecap="round"/>
  <rect x="228" y="250" width="180" height="18" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <g stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="4 3">
    <line x1="150" y1="190" x2="470" y2="190"/>
    <line x1="150" y1="230" x2="470" y2="230"/>
    <line x1="150" y1="305" x2="470" y2="305"/>
  </g>
  <circle cx="318" cy="230" r="3" fill="#2C2C2A"/>
  <circle cx="318" cy="305" r="3" fill="#2C2C2A"/>
  <g stroke="#888780" stroke-width="0.6" stroke-dasharray="3 2">
    <line x1="310" y1="125" x2="480" y2="105"/>
    <line x1="210" y1="215" x2="150" y2="250"/>
    <line x1="408" y1="259" x2="480" y2="267"/>
  </g>
  <g fill="#444441">
    <text x="486" y="54">Back of shelf</text>
    <text x="486" y="109">Leaner (tip goes 3 cm past its front)</text>
    <text x="40" y="264">Book sticking out furthest</text>
    <text x="486" y="194">y_in: rod tip while pushing</text>
    <text x="486" y="234">y_out: furthest front + 3 cm</text>
    <text x="486" y="271">Hand, ~21 cm wide</text>
    <text x="486" y="309">Staging point: y_out + 10 cm</text>
  </g>
</svg>

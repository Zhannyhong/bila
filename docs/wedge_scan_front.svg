<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Wedge height scan, front view (x along the row, z up)</title>
  <rect width="680" height="360" fill="#ffffff"/>
  <text x="20" y="24" font-size="14" font-weight="bold" fill="#2C2C2A">Front view: x along the row, z up</text>
  <rect x="80" y="300" width="340" height="12" rx="2" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <polygon points="223,287 250,300 330,140 303,127" fill="#CECBF6" stroke="#534AB7" stroke-width="0.8"/>
  <rect x="330" y="100" width="45" height="200" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <g stroke="#1D9E75" stroke-width="1.5">
    <line x1="257" y1="286" x2="330" y2="286"/>
    <line x1="263" y1="274" x2="330" y2="274"/>
    <line x1="269" y1="262" x2="330" y2="262"/>
    <line x1="275" y1="250" x2="330" y2="250"/>
    <line x1="281" y1="238" x2="330" y2="238"/>
    <line x1="287" y1="226" x2="330" y2="226"/>
  </g>
  <line x1="293" y1="214" x2="330" y2="214" stroke="#0F6E56" stroke-width="3"/>
  <line x1="299" y1="202" x2="330" y2="202" stroke="#E24B4A" stroke-width="1.5"/>
  <line x1="200" y1="194" x2="345" y2="194" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="4 3"/>
  <circle cx="302" cy="214" r="6" fill="#E24B4A"/>
  <circle cx="250" cy="300" r="3" fill="#2C2C2A"/>
  <g stroke="#888780" stroke-width="0.6" stroke-dasharray="3 2">
    <line x1="270" y1="160" x2="440" y2="70"/>
    <line x1="375" y1="120" x2="440" y2="110"/>
    <line x1="345" y1="194" x2="440" y2="160"/>
    <line x1="330" y1="202" x2="440" y2="196"/>
    <line x1="308" y1="214" x2="440" y2="232"/>
    <line x1="330" y1="286" x2="440" y2="276"/>
    <line x1="250" y1="300" x2="200" y2="330"/>
  </g>
  <g fill="#444441">
    <text x="446" y="74">Leaning book (leaner)</text>
    <text x="446" y="114">Far book (leaner rests on it)</text>
    <text x="446" y="164">Scan ceiling: 60% of leaner height</text>
    <text x="446" y="200">Too narrow (w &lt; 2.4 cm)</text>
    <text x="446" y="236">Chosen z: highest that fits (rod)</text>
    <text x="446" y="280">Scan starts at board top + 3.5 cm</text>
    <text x="60" y="344">pivot_x: gap-side bottom edge of the leaner</text>
  </g>
</svg>

[project]
name = "bookshelf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.15.0",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]   # the modules live at the repo root
testpaths = ["tests"]

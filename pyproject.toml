[project]
name = "bookshelf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mediapy>=1.2.7",
    "mujoco>=3.15.0",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
]
rl = [
    "gymnasium>=1.4.0",
    "stable-baselines3>=2.9.2",
    "tensorboard>=2.21.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]   # the repo root, so tests import the bila package
testpaths = ["tests"]
